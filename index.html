<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>スマブラSP2択キャラランク</title>
  <meta name="description" content="スマブラキャラを2択で投票してランキングを作るサイト。リアルタイムで勝率ランキングを確認できます。">
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    button { padding: 10px 20px; margin: 10px; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    #ranking-container {
      max-height: 500px;
      overflow-y: auto;
      margin: 20px auto;
      width: 90%;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>スマブラSP2択キャラランク</h1>

  <!-- 投票画面 -->
  <div>
    <h2 id="charA"></h2>
    <button onclick="vote('A')">投票</button>
    <h2 id="charB"></h2>
    <button onclick="vote('B')">投票</button>
  </div>

  <!-- ランキング表示 -->
  <h2>ランキング</h2>
  <div id="ranking-container">
    <table id="ranking">
      <thead>
        <tr>
          <th>順位</th>
          <th>キャラ</th>
          <th>勝ち数</th>
          <th>試合数</th>
          <th>勝率</th>
          <th>前回比</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- ★ 一時的に置く修正ボタン（修正後は削除OK） -->
  <!-- <button onclick="fullFixData()">データ完全修正を実行</button> -->

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

  <script>
    // Firebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyC_zETBlV96I3QmqRYUJih514kAKEVLxdc",
      authDomain: "smash-vote.firebaseapp.com",
      databaseURL: "https://smash-vote-default-rtdb.firebaseio.com",
      projectId: "smash-vote",
      storageBucket: "smash-vote.firebasestorage.app",
      messagingSenderId: "247917547200",
      appId: "1:247917547200:web:caa0eaf0bbb53413c4a725",
      measurementId: "G-DBC4GSYBXB"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Firebase禁止文字を安全なキーに変換
    function safeKey(name) {
      return name.replace(/[.#$/[\]]/g, "_");
    }

    // キャラ一覧
    let characters = [
      "マリオ","ドンキーコング","リンク","サムス","ダークサムス","ヨッシー","カービィ","フォックス","ピカチュウ","ルイージ",
      "ネス","キャプテン・ファルコン","プリン","ピーチ/デイジー","クッパ","アイスクライマー","シーク","ゼルダ","ドクターマリオ",
      "ピチュー","ファルコ","マルス","ルキナ","こどもリンク","ガノンドロフ","ミュウツー","ロイ","クロム","Mr.ゲーム&ウォッチ",
      "メタナイト","ピット","ブラックピット","ゼロスーツサムス","ワリオ","スネーク","アイク","ポケモントレーナー","ディディーコング","リュカ",
      "ソニック","デデデ","ピクミン&オリマー","ルカリオ","ロボット","トゥーンリンク","ウルフ","むらびと","ロックマン","Wii Fit トレーナー",
      "ロゼッタ&チコ","リトル・マック","ゲッコウガ","Mii 格闘タイプ","Mii 剣術タイプ","Mii 射撃タイプ","パルテナ","パックマン","ルフレ","シュルク",
      "クッパJr.","ダックハント","リュウ","ケン","クラウド","カムイ","ベヨネッタ","インクリング","リドリー","シモン/リヒター",
      "キングクルール","しずえ","ガオガエン","パックンフラワー","ジョーカー","勇者","バンジョー&カズーイ","テリー","ベレト/ベレス","ミェンミェン",
      "スティーブ","セフィロス","ホムラ/ヒカリ","カズヤ","ソラ"
    ];

    let previousRanks = {};
    let currentA, currentB;

    // ★ 試合数が少ないキャラを優先して選ぶ（均等抽選）
    function pickCharacters() {
      db.ref("votes").once("value").then(snapshot => {
        let data = snapshot.val() || {};

        let sorted = characters.slice().sort((a, b) => {
          let ma = (data[safeKey(a)]?.matches) || 0;
          let mb = (data[safeKey(b)]?.matches) || 0;
          return ma - mb;
        });

        let pool = sorted.slice(0, 20);
        let shuffled = pool.sort(() => 0.5 - Math.random());

        currentA = shuffled[0];
        currentB = shuffled[1];

        document.getElementById("charA").textContent = currentA;
        document.getElementById("charB").textContent = currentB;
      });
    }

    // ★ wins と matches を1つの transaction で更新
    function vote(choice) {
      let winner = (choice === "A") ? currentA : currentB;
      let loser = (choice === "A") ? currentB : currentA;

      let wKey = safeKey(winner);
      let lKey = safeKey(loser);

      db.ref("votes").transaction(votes => {
        let newVotes = votes || {};

        if (!newVotes[wKey]) newVotes[wKey] = { wins: 0, matches: 0 };
        if (!newVotes[lKey]) newVotes[lKey] = { wins: 0, matches: 0 };

        newVotes[wKey].wins += 1;
        newVotes[wKey].matches += 1;
        newVotes[lKey].matches += 1;

        return newVotes;
      });

      let timestamp = new Date().toLocaleTimeString();
      db.ref("history").push({ time: timestamp, winner, loser });

      pickCharacters();
    }

    // ランキング更新
    db.ref("votes").on("value", snapshot => {
      let data = snapshot.val() || {};

      let ranking = characters.map(name => {
        let stats = data[safeKey(name)] || {};
        let wins = stats.wins || 0;
        let matches = stats.matches || 0;
        let winRate = matches > 0 ? (wins / matches * 100).toFixed(1) : 0;
        return { name, wins, matches, winRate };
      });

      ranking.sort((a, b) => b.winRate - a.winRate);

      let tbody = document.querySelector("#ranking tbody");
      tbody.innerHTML = "";

      ranking.forEach((char, index) => {
        let rank = index + 1;

        let arrow = `<span style="color: gray;">→</span>`;
        if (previousRanks[char.name] !== undefined) {
          if (previousRanks[char.name] > rank) arrow = `<span style="color: red;">↑</span>`;
          else if (previousRanks[char.name] < rank) arrow = `<span style="color: blue;">↓</span>`;
        }

        let row = `
          <tr>
            <td>${rank}</td>
            <td>${char.name}</td>
            <td>${char.wins}</td>
            <td>${char.matches}</td>
            <td>${char.winRate}%</td>
            <td>${arrow}</td>
          </tr>
        `;
        tbody.innerHTML += row;

        previousRanks[char.name] = rank;
      });
    });

    // ★ 古いキーの移行 + 不整合修正（完全修復）
    function fullFixData() {
      db.ref("votes").once("value").then(snapshot => {
        let data = snapshot.val() || {};
        let updates = {};
        let deletes = {};

        characters.forEach(name => {
          let oldKey = name;
          let newKey = safeKey(name);

          let stats = data[oldKey] || data[newKey] || {};
          let wins = stats.wins || 0;
          let matches = stats.matches || 0;

          if (wins > matches) matches = wins;

          updates[newKey] = { wins, matches };

          if (data[oldKey] && oldKey !== newKey) {
            deletes[oldKey] = null;
          }
        });

        db.ref("votes").update(updates).then(() => {
          db.ref("votes").update(deletes).then(() => {
            alert("データ完全修正が完了しました！");
          });
        });
      });
    }

    pickCharacters();
  </script>
</body>
</html>
